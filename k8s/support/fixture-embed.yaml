apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixture-embed
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-embed
  namespace: rahbar
spec:
  replicas: 1
  selector:
    matchLabels: {app: fixture-embed}
  template:
    metadata:
      labels: {app: fixture-embed}
    spec:
      serviceAccountName: fixture-embed
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fixture-embed
          image: python:3.12-slim-bookworm
          command: [python, /fixture/fixture_embed.py]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /, port: 11434}
          volumeMounts:
            - {name: code, mountPath: /fixture, readOnly: true}
      volumes:
        - name: code
          configMap: {name: fixture-embed}
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-embed
  namespace: rahbar
spec:
  selector: {app: fixture-embed}
  ports:
    - {port: 11434, targetPort: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-embed-in
  namespace: rahbar
spec:
  podSelector: {matchLabels: {app: fixture-embed}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: indexer}}
      ports: [{port: 11434, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-embed-out
  namespace: rahbar
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, indexer]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: fixture-embed}}
      ports: [{port: 11434, protocol: TCP}]
