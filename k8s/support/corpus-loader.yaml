apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
spec:
  serviceAccountName: indexer
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox:1.37.0
      command: ["sleep", "600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 48Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - {name: corpus, mountPath: /corpus}
  volumes:
    - name: corpus
      persistentVolumeClaim: {claimName: corpus-data}
