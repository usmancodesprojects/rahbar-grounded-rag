apiVersion: "apps/v1"
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "api"
  template:
    metadata:
      labels:
        app: "api"
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: "api"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: "rahbar-api:dev"
          envFrom:
            - configMapRef:
                name: "rahbar-config"
            - secretRef:
                name: "rahbar-secret"
                optional: true
          ports:
            - name: "http"
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
          startupProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 8000
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - "sleep 5"
      volumes:
        - name: "tmp"
          emptyDir: {}
      terminationGracePeriodSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
