apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "chroma"
spec:
  serviceName: "chroma"
  replicas: 1
  selector:
    matchLabels:
      app: "chroma"
  template:
    metadata:
      labels:
        app: "chroma"
    spec:
      serviceAccountName: "chroma"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - name: "chroma"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          image: "chromadb/chroma:1.0.12"
          ports:
            - name: "http"
              containerPort: 8000
          env:
            - name: "ANONYMIZED_TELEMETRY"
              value: "FALSE"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: "/api/v2/heartbeat"
              port: 8000
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: "/api/v2/heartbeat"
              port: 8000
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
            - name: "data"
              mountPath: "/data"
          command:
            - "chroma"
          args:
            - "run"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--path"
            - "/data"
      volumes:
        - name: "tmp"
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "3Gi"
