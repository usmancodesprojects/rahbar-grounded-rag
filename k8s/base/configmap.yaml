apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "rahbar-config"
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  EMBED_MODEL: "nomic-embed-text:v1.5"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  CORPUS_DIR: "/corpus"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.52"
  CACHE_THRESHOLD: "0.96"
  TEMPERATURE: "0.1"
  REDIS_URL: "redis://redis:6379/0"
  LOG_LEVEL: "INFO"
