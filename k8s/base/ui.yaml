apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "ui"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "ui"
  template:
    metadata:
      labels:
        app: "ui"
    spec:
      serviceAccountName: "ui"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - name: "ui"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          image: "rahbar-ui:dev"
          ports:
            - name: "http"
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "96Mi"
          readinessProbe:
            httpGet:
              path: "/"
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
      volumes:
        - name: "tmp"
          emptyDir: {}
