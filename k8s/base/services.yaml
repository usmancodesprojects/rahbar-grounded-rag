apiVersion: "v1"
kind: "Service"
metadata:
  name: "api"
spec:
  type: "ClusterIP"
  selector:
    app: "api"
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "ui"
spec:
  type: "ClusterIP"
  selector:
    app: "ui"
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "chroma"
spec:
  type: "ClusterIP"
  selector:
    app: "chroma"
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "redis"
spec:
  type: "ClusterIP"
  selector:
    app: "redis"
  ports:
    - port: 6379
      targetPort: 6379
