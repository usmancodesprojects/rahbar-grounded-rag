name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: make install lint test
  build-push:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, ui, indexer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.component }}:${{ github.sha }}
  deploy:
    needs: [build-push]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx==0.28.1 pyyaml==6.0.2
      - uses: helm/kind-action@v1.12.0
        with: {cluster_name: rahbar-cd, version: v0.27.0}
      - run: bash scripts/install_ingress.sh
      - run: |
          mkdir -p k8s/overlays/release
          cat > k8s/overlays/release/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources: [../prod]
          images:
            - {name: rahbar-api, newName: "${DOCKERHUB_USERNAME}/rahbar-api", newTag: "${GITHUB_SHA}"}
            - {name: rahbar-ui, newName: "${DOCKERHUB_USERNAME}/rahbar-ui", newTag: "${GITHUB_SHA}"}
            - {name: rahbar-indexer, newName: "${DOCKERHUB_USERNAME}/rahbar-indexer", newTag: "${GITHUB_SHA}"}
          EOF
          bash scripts/fixture_cluster.sh k8s/overlays/release
          kubectl -n rahbar rollout status deployment/api --timeout=180s
          bash scripts/fixture_ingress.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: deployment-smoke-results, path: fixture-results.json, if-no-files-found: ignore}
